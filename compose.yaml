# Compose per Ubuntu Server (Docker Engine, via SSH).
# Avvio: docker compose up -d
#
# network_mode: host è il modo consigliato da Home Assistant su Linux.
# Le variabili HA_PORT e NODE_RED_PORT in .env vengono ignorate:
# Home Assistant ascolta 8123, Node-RED ascolta 1880 sull'IP del server.

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ}
    volumes:
      - ${HA_CONFIG_DIR}:/config
      - /etc/localtime:/etc/localtime:ro
      # Bluetooth sul server (decommenta se usi adattatori BT):
      # - /run/dbus:/run/dbus:ro

  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    restart: unless-stopped
    depends_on:
      - homeassistant
    network_mode: host
    environment:
      TZ: ${TZ}
    volumes:
      - ${NODE_RED_DATA_DIR}:/data

  # LLM locale. In Home Assistant: Impostazioni → Dispositivi → Aggiungi → Ollama
  # URL: http://127.0.0.1:11434
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${OLLAMA_DIR}:/root/.ollama

  # Speech-to-text (Wyoming). In HA: integrazione Wyoming Protocol, host 127.0.0.1 porta 10300
  whisper:
    image: rhasspy/wyoming-whisper
    container_name: whisper
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${WHISPER_DIR}:/data
    command: --model ${WHISPER_MODEL} --language ${WHISPER_LANGUAGE}

  # Text-to-speech (Wyoming). In HA: integrazione Wyoming Protocol, host 127.0.0.1 porta 10200
  piper:
    image: rhasspy/wyoming-piper
    container_name: piper
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${PIPER_DIR}:/data
    command: --voice ${PIPER_VOICE}
